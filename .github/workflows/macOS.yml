name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos_test:
    name: Execute tests on macOS
    runs-on: ${{ matrix.os }}
    # DIAGNOSTICS BRANCH — not for merging. Fail a stalled run instead of
    # letting it sit until GitHub's 360-minute default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon runners only: MachOFileTests.preferredArchitecture == .arm64.
        # Adding an Intel runner would load a different arch slice and drift snapshots.
        os: [macos-26]
        xcode-version: ["26.6"]
        # debug and release run as parallel jobs — sequentially they doubled
        # the wall clock (14m + 21m cold). Release stays in the matrix on
        # purpose: optimizer-sensitive pointer bugs only surface there.
        configuration: [debug, release]
    env:
      MACHO_SWIFT_SECTION_SILENT_TEST: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}
      - name: Swift version
        run: swift --version

      - name: Resolve SPM dependencies
        run: swift package update

      - name: Cache SymbolTests DerivedData
        uses: actions/cache@v4
        with:
          path: Tests/Projects/SymbolTests/DerivedData
          key: symboltests-${{ matrix.xcode-version }}-${{ hashFiles('Tests/Projects/SymbolTests/**/*.swift', 'Tests/Projects/SymbolTests/**/*.pbxproj', '.github/workflows/macOS.yml') }}

      - name: Build SymbolTestsCore fixture
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Tests/Projects/SymbolTests/SymbolTests.xcodeproj \
            -scheme SymbolTestsCore \
            -configuration Release \
            -derivedDataPath Tests/Projects/SymbolTests/DerivedData \
            -destination 'generic/platform=macOS' \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Normalize fixture framework paths
        run: |
          set -eo pipefail
          # The tests look for the frameworks under DerivedData/SymbolTests/...,
          # while xcodebuild writes them to DerivedData/Build/Products/Release.
          # Link every framework the tests need, not just SymbolTestsCore:
          # DependencyClosureTests resolves SymbolTestsHelper through the same
          # expected path, and omitting it fails that suite with
          # "The file SymbolTestsHelper doesn't exist".
          root="Tests/Projects/SymbolTests/DerivedData"
          expected_dir="$root/SymbolTests/Build/Products/Release"
          echo "--- frameworks found under DerivedData ---"
          find "$root" -path '*/Build/Products/Release/*.framework' -maxdepth 6 -type d 2>/dev/null || true
          mkdir -p "$expected_dir"
          for framework in SymbolTestsCore SymbolTestsHelper; do
            expected="$expected_dir/$framework.framework"
            if [ -d "$expected" ] && [ ! -L "$expected" ]; then
              echo "$framework already at expected path; nothing to do."
              continue
            fi
            # Prefer a Release build product (skip Intermediates and Debug).
            found=$(find "$root" -path "*/Build/Products/Release/$framework.framework" -type d 2>/dev/null | head -1)
            if [ -z "$found" ]; then
              echo "ERROR: $framework.framework not found at any Build/Products/Release/ path."
              echo "--- DerivedData top 3 levels ---"
              find "$root" -maxdepth 3 -type d
              exit 1
            fi
            ln -sfn "$(realpath "$found")" "$expected"
            echo "Linked $found -> $expected"
            ls -la "$expected/Versions/A/$framework"
          done

      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: symboltests-derived-data-logs-${{ matrix.configuration }}
          path: Tests/Projects/SymbolTests/DerivedData/Logs
          if-no-files-found: ignore

      - name: Restore SwiftPM build directory
        # Restore only: a diagnostics PR must not save another 2.5 GB
        # PR-scoped cache and push main's caches out of the 10 GB quota.
        uses: actions/cache/restore@v4
        with:
          path: .build-test-${{ matrix.configuration }}
          # This step runs after `swift package update`, so the key hashes the
          # post-update Package.resolved: a floated dependency bump rotates
          # the key, and restore-keys falls back to the newest cache for the
          # same configuration — an almost-warm build instead of a cold one.
          key: spm-build-${{ matrix.os }}-${{ matrix.xcode-version }}-${{ matrix.configuration }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-build-${{ matrix.os }}-${{ matrix.xcode-version }}-${{ matrix.configuration }}-

      - name: Build tests (${{ matrix.configuration }})
        run: |
          swift build --build-tests \
            -c ${{ matrix.configuration }} \
            --enable-experimental-prebuilts \
            --build-path .build-test-${{ matrix.configuration }}

      - name: Run tests under a hang watchdog (${{ matrix.configuration }})
        env:
          # A healthy test phase takes 2-7 minutes; past this the run is stalled.
          WATCHDOG_SECONDS: 720
        run: |
          set +e
          diagnostics="$RUNNER_TEMP/hang-diagnostics"
          mkdir -p "$diagnostics"
          events="$diagnostics/events.jsonl"
          echo "Runner: $(sysctl -n hw.activecpu) active CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB memory"

          # The event stream is written per event, unlike the console output,
          # which reaches the log in buffered chunks and hides where a stall is.
          swift test \
            -c ${{ matrix.configuration }} \
            --skip-build \
            --enable-experimental-prebuilts \
            --build-path .build-test-${{ matrix.configuration }} \
            --event-stream-output-path "$events" \
            --event-stream-version 0 \
            --filter '\.(SymbolTestsCoreDumpSnapshotTests|SymbolTestsCoreInterfaceSnapshotTests|SymbolTestsCoreCoverageInvariantTests|STCoreE2ETests|STCoreTests|GenericSpecializationTests|MultiPayloadEnumTests|SymbolicDemanglerDemanglingTests|MalformedSymbolValueTests|ContinuousIntegrationTestFilterTests|MachOImageCacheMembershipTests|SharedCacheResolveTests|SharedCacheResolveSwiftConcurrencyTests|SharedCacheKeyTests|SharedCacheRegistryTests|DependencyLoadNameTests|DependencyClosureTests|FileDependencyLocatorTests|SwiftInterfaceBuilderDependenciesTests|ManglingPrefixTests|MethodDescriptorTests|MethodOverrideDescriptorTests|MethodDefaultOverrideDescriptorTests|ProtocolRequirementTests|ResilientWitnessTests|LargeStackTaskExecutionTests|BoundedConcurrentMapTests|SwiftEvolutionInterfaceBuilderTests|EvolutionCommandValidationTests|DiffCommandValidationTests|ObjCSectionCommandTests|ObjCAPICommandParsingTests|ObjCDumpDiagnosticsTests)(/|$)' > "$diagnostics/test-output.log" 2>&1 &
          test_pid=$!

          started_at=$SECONDS
          while kill -0 "$test_pid" 2>/dev/null && (( SECONDS - started_at < WATCHDOG_SECONDS )); do
            sleep 15
          done

          if kill -0 "$test_pid" 2>/dev/null; then
            echo "::error::swift test still running after ${WATCHDOG_SECONDS}s; capturing diagnostics"

            echo "::group::Memory"
            vm_stat
            sysctl vm.swapusage
            memory_pressure -Q
            echo "::endgroup::"

            echo "::group::Top processes"
            top -l 1 -o cpu -n 20 -stats pid,command,cpu,th,mem,state
            echo "::endgroup::"

            echo "::group::Tests started but never ended (start time, test ID)"
            jq -r 'select(.kind == "event") | .payload
                   | select(.kind == "testStarted" or .kind == "testEnded")
                   | [.kind, (.instant.since1970 | tostring), .testID] | @tsv' "$events" \
              | awk -F'\t' '$1 == "testStarted" { started[$3] = $2 } $1 == "testEnded" { delete started[$3] } END { for (id in started) print started[id], id }' \
              | sort -n
            echo "::endgroup::"

            echo "::group::Last 40 events"
            tail -n 40 "$events" | jq -c '.payload | {kind, testID, since1970: .instant.since1970}'
            echo "::endgroup::"

            for pid in $(pgrep -f swiftpm-testing-helper) $(pgrep -x xctest); do
              echo "::group::Thread stacks of $pid ($(ps -o command= -p "$pid" | cut -c1-160))"
              if sample "$pid" 5 -mayDie -file "$diagnostics/sample-$pid.txt" >/dev/null 2>&1; then
                cat "$diagnostics/sample-$pid.txt"
              else
                sudo spindump "$pid" 5 -file "$diagnostics/spindump-$pid.txt" >/dev/null 2>&1
                sudo cat "$diagnostics/spindump-$pid.txt"
              fi
              echo "::endgroup::"
            done

            kill -TERM "$test_pid"
            sleep 5
            pkill -KILL -f swiftpm-testing-helper
            test_status=124
          else
            wait "$test_pid"
            test_status=$?
          fi

          echo "::group::swift test output"
          cat "$diagnostics/test-output.log"
          echo "::endgroup::"
          exit "$test_status"

      - name: Upload hang diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-diagnostics-${{ matrix.configuration }}
          path: ${{ runner.temp }}/hang-diagnostics
          if-no-files-found: ignore
