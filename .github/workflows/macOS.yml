name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos_test:
    name: Execute tests on macOS
    runs-on: ${{ matrix.os }}
    # A healthy job takes 8-26 minutes. Without a limit a stalled test run
    # sits until GitHub's 360-minute default (it did on 2026-09-29).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon runners only: MachOFileTests.preferredArchitecture == .arm64.
        # Adding an Intel runner would load a different arch slice and drift snapshots.
        os: [macos-26]
        xcode-version: ["26.6"]
        # debug and release run as parallel jobs — sequentially they doubled
        # the wall clock (14m + 21m cold). Release stays in the matrix on
        # purpose: optimizer-sensitive pointer bugs only surface there.
        configuration: [debug, release]
    env:
      MACHO_SWIFT_SECTION_SILENT_TEST: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}
      - name: Swift version
        run: swift --version

      - name: Resolve SPM dependencies
        run: swift package update

      - name: Cache SymbolTests DerivedData
        uses: actions/cache@v4
        with:
          path: Tests/Projects/SymbolTests/DerivedData
          key: symboltests-${{ matrix.xcode-version }}-${{ hashFiles('Tests/Projects/SymbolTests/**/*.swift', 'Tests/Projects/SymbolTests/**/*.pbxproj', '.github/workflows/macOS.yml') }}

      - name: Build SymbolTestsCore fixture
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Tests/Projects/SymbolTests/SymbolTests.xcodeproj \
            -scheme SymbolTestsCore \
            -configuration Release \
            -derivedDataPath Tests/Projects/SymbolTests/DerivedData \
            -destination 'generic/platform=macOS' \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Normalize fixture framework paths
        run: |
          set -eo pipefail
          # The tests look for the frameworks under DerivedData/SymbolTests/...,
          # while xcodebuild writes them to DerivedData/Build/Products/Release.
          # Link every framework the tests need, not just SymbolTestsCore:
          # DependencyClosureTests resolves SymbolTestsHelper through the same
          # expected path, and omitting it fails that suite with
          # "The file SymbolTestsHelper doesn't exist".
          root="Tests/Projects/SymbolTests/DerivedData"
          expected_dir="$root/SymbolTests/Build/Products/Release"
          echo "--- frameworks found under DerivedData ---"
          find "$root" -path '*/Build/Products/Release/*.framework' -maxdepth 6 -type d 2>/dev/null || true
          mkdir -p "$expected_dir"
          for framework in SymbolTestsCore SymbolTestsHelper; do
            expected="$expected_dir/$framework.framework"
            if [ -d "$expected" ] && [ ! -L "$expected" ]; then
              echo "$framework already at expected path; nothing to do."
              continue
            fi
            # Prefer a Release build product (skip Intermediates and Debug).
            found=$(find "$root" -path "*/Build/Products/Release/$framework.framework" -type d 2>/dev/null | head -1)
            if [ -z "$found" ]; then
              echo "ERROR: $framework.framework not found at any Build/Products/Release/ path."
              echo "--- DerivedData top 3 levels ---"
              find "$root" -maxdepth 3 -type d
              exit 1
            fi
            ln -sfn "$(realpath "$found")" "$expected"
            echo "Linked $found -> $expected"
            ls -la "$expected/Versions/A/$framework"
          done

      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: symboltests-derived-data-logs-${{ matrix.configuration }}
          path: Tests/Projects/SymbolTests/DerivedData/Logs
          if-no-files-found: ignore

      - name: Cache SwiftPM build directory
        uses: actions/cache@v4
        with:
          path: .build-test-${{ matrix.configuration }}
          # This step runs after `swift package update`, so the key hashes the
          # post-update Package.resolved: a floated dependency bump rotates
          # the key, and restore-keys falls back to the newest cache for the
          # same configuration — an almost-warm build instead of a cold one.
          key: spm-build-${{ matrix.os }}-${{ matrix.xcode-version }}-${{ matrix.configuration }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-build-${{ matrix.os }}-${{ matrix.xcode-version }}-${{ matrix.configuration }}-

      - name: Build and run tests (${{ matrix.configuration }})
        run: |
          swift test \
            -c ${{ matrix.configuration }} \
            --enable-experimental-prebuilts \
            --build-path .build-test-${{ matrix.configuration }} \
            --filter '\.(SymbolTestsCoreDumpSnapshotTests|SymbolTestsCoreInterfaceSnapshotTests|SymbolTestsCoreCoverageInvariantTests|STCoreE2ETests|STCoreTests|GenericSpecializationTests|MultiPayloadEnumTests|SymbolicDemanglerDemanglingTests|MalformedSymbolValueTests|ContinuousIntegrationTestFilterTests|MachOImageCacheMembershipTests|SharedCacheResolveTests|SharedCacheResolveSwiftConcurrencyTests|SharedCacheKeyTests|SharedCacheRegistryTests|DependencyLoadNameTests|DependencyClosureTests|FileDependencyLocatorTests|SwiftInterfaceBuilderDependenciesTests|ManglingPrefixTests|MethodDescriptorTests|MethodOverrideDescriptorTests|MethodDefaultOverrideDescriptorTests|ProtocolRequirementTests|ResilientWitnessTests|LargeStackTaskExecutionTests|BoundedConcurrentMapTests|SwiftEvolutionInterfaceBuilderTests|EvolutionCommandValidationTests|DiffCommandValidationTests|ObjCSectionCommandTests|ObjCAPICommandParsingTests|ObjCDumpDiagnosticsTests|MachOSourceTests|InterfaceAnnotationStyleTests|TransformerRequestTests|ABIRequestTests|DumpAndInterfaceRequestTests|ObjCRequestTests|CommandRequestMappingTests|CommandLineErrorTranslationTests|StandardStreamOutputTests|CommandLineStreamWriteScanTests|ConcurrentDefinitionPrintingTests|NestedFieldOffsetMemoizationTests|NestedDefinitionRegionContractTests|ProtocolInExtensionTests)(/|$)'

      - name: Run the SharedCache suites on a one-thread cooperative pool (${{ matrix.configuration }})
        # The runner has 3 cores, so the Swift Concurrency cooperative pool is
        # 3 threads wide. On 2026-09-29 three tests each blocked one of those
        # threads waiting for work that itself needed a thread, and the whole
        # test process froze. With the pool forced down to one thread, a test
        # that blocks a pool thread on such work hangs here on every run —
        # rather than only when three of them happen to line up — and the
        # step timeout turns the hang into a failure. The two
        # `differentKeysParallelVia…` tests are skipped: they prove overlap,
        # which needs two pool threads by design.
        # `ConcurrentDefinitionPrintingTests` is here because a definition's
        # first print blocks every other print of it until its one indexing
        # pass ends (`DefinitionIndexing`); that pass must never need a pool
        # thread to finish.
        timeout-minutes: 5
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: 1
        run: |
          swift test \
            -c ${{ matrix.configuration }} \
            --skip-build \
            --enable-experimental-prebuilts \
            --build-path .build-test-${{ matrix.configuration }} \
            --filter '\.(SharedCacheResolveTests|SharedCacheResolveSwiftConcurrencyTests|ConcurrentDefinitionPrintingTests)/' \
            --skip 'differentKeysParallelVia'
